name: Sphinx

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - main
jobs:

  sphinx-doc-check:
    name: Sphinx
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4
    - name: Build docs
      run: |
        sudo apt-get update
        python -m venv idris2docs_venv
        source idris2docs_venv/bin/activate
        pip install -r docs/requirements.txt
        cd docs
        make html
